# The probes print a comparison table; the Hadoop/parquet-java stack stays at WARN to keep that output readable.
# Override per run with -Dorg.slf4j.simpleLogger.defaultLogLevel=info (or for a single logger).
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
